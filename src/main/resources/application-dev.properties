## MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#`hibernate_sequence' doesn't exist
spring.jpa.hibernate.use-new-id-generator-mappings=false

# drop n create table, good for testing, comment this in production
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Batch fetching demo support (pairs with @BatchSize on Car#foods)
spring.jpa.properties.hibernate.default_batch_fetch_size=16

image.upload.path=D://laser//images

# Set the maximum allowed file size in bytes
spring.servlet.multipart.max-file-size=50MB

# Set the maximum allowed request size (including multipart/form-data and other data) in bytes
spring.servlet.multipart.max-request-size=50MB

spring.mail.host=mail.imperial.com
spring.mail.port=587
spring.mail.username=info@imperial.com
spring.mail.password=HIQO0RQ6UQLX
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# YachtModule / Hibernate lab: verbose SQL (Hibernate 5.x also honors org.hibernate.type.descriptor.sql.BasicBinder=TRACE)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


